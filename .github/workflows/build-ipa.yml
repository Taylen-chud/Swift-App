name: Build unsigned IPA

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Export DEVELOPER_DIR
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Install tools
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, unsigned)
        run: |
          xcodebuild \
            -project SwiftApp.xcodeproj \
            -scheme SwiftApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

       - name: Verify and Package unsigned IPA
         run: |
          set -euo pipefail

          APP="build/dd/Build/Products/Release-iphoneos/SwiftApp.app"

          echo "========================================"
          echo "Checking generated app"
          echo "========================================"

          if [ ! -d "$APP" ]; then
            echo "ERROR: App bundle does not exist:"
            echo "$APP"
            exit 1
          fi

          echo ""
          echo "App contents:"
          find "$APP" -maxdepth 2 -print

          echo ""
          echo "========================================"
          echo "Info.plist"
          echo "========================================"

          /usr/libexec/PlistBuddy -c "Print" "$APP/Info.plist"

          echo ""
          echo "========================================"
          echo "Bundle information"
          echo "========================================"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist")

          echo "Bundle ID:       $BUNDLE_ID"
          echo "Executable:      $EXECUTABLE"
          echo "Display Name:    $DISPLAY_NAME"

          echo ""
          echo "========================================"
          echo "Checking executable"
          echo "========================================"

          if [ -z "$EXECUTABLE" ]; then
            echo "ERROR: CFBundleExecutable is empty."
            exit 1
          fi

          if [ ! -f "$APP/$EXECUTABLE" ]; then
            echo "ERROR: CFBundleExecutable points to a file that does not exist:"
            echo "$APP/$EXECUTABLE"
            exit 1
          fi

          echo "Executable exists:"
          echo "$APP/$EXECUTABLE"

          echo ""
          echo "Executable type:"
          file "$APP/$EXECUTABLE"

          echo ""
          echo "========================================"
          echo "Checking Mach-O architecture"
          echo "========================================"

          lipo -info "$APP/$EXECUTABLE"

          echo ""
          echo "========================================"
          echo "Creating IPA"
          echo "========================================"

          rm -rf build/Payload SwiftApp.ipa
          mkdir -p build/Payload

          cp -R "$APP" build/Payload/

          find build/Payload -name '.DS_Store' -delete

          (
            cd build
            zip -qr ../SwiftApp.ipa Payload
          )

          echo ""
          echo "IPA created:"
          ls -lh SwiftApp.ipa

          echo ""
          echo "IPA contents:"
          unzip -l SwiftApp.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftApp-unsigned
          path: SwiftApp.ipa
          if-no-files-found: error

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SwiftApp.ipa

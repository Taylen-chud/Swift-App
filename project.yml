name: SwiftApp

options:
  bundleIdPrefix: com.taylen

targets:
  SwiftApp:
    type: application
    platform: iOS
    deploymentTarget: "18.0"

    sources:
      - path: SwiftApp

    settings:
      INFOPLIST_FILE: SwiftApp/Info.plist
      PRODUCT_NAME: SwiftApp
      EXECUTABLE_NAME: SwiftApp
      PRODUCT_BUNDLE_IDENTIFIER: com.taylen.SwiftApp

      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
